name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # local.properties is gitignored, so CI has to write its own. The keys
      # only need to exist for buildConfigField; the debug APK is never run
      # against a real project here, so empty placeholders are enough.
      - name: Write local.properties
        run: |
          echo "SUPABASE_URL=https://ci.invalid" >> local.properties
          echo "SUPABASE_ANON_KEY=ci-placeholder" >> local.properties
          echo "GROQ_API_KEY=ci-placeholder" >> local.properties

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
